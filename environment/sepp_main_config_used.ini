[pplacer]
path = <REPOSITORY_ROOT>/code/pplacer_epa_ng_compat.py

[hmmalign]
path = <PICRUST2_ENV_PREFIX>/bin/hmmalign

[hmmsearch]
path = <PICRUST2_ENV_PREFIX>/bin/hmmsearch
piped = False
elim = 10000
filters = True

[hmmbuild]
path = <PICRUST2_ENV_PREFIX>/bin/hmmbuild

[jsonmerger]
path = <PICRUST2_ENV_PREFIX>/bin/seppJsonMerger.jar

[exhaustive]
strategy = centroid
minsubsetsize = 20
placementminsubsetsizefacotr = 4
placer = pplacer
weight_placement_by_alignment = True
